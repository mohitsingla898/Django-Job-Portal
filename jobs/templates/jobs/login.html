<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobFinder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .brand {
            color: #2563eb;
            font-size: 28px;
            font-weight: 800;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-login {
            background: #2563eb;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #1e40af;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container px-3">
        <div class="login-card mx-auto">

            <div class="text-center mb-4">
                <a href="{% url 'job_list' %}"
                   class="brand text-decoration-none">
                    💼 JobFinder
                </a>

                <h3 class="fw-bold mt-3">Welcome Back!</h3>
                <p class="text-muted">
                    Login to continue your job search.
                </p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger">
                    Invalid username or password.
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold">
                        Username
                    </label>

                    <input type="text"
                           name="username"
                           id="id_username"
                           class="form-control"
                           placeholder="Enter your username"
                           autocomplete="username"
                           required>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           id="id_password"
                           class="form-control"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>
                </div>

                <input type="hidden"
                       name="next"
                       value="{{ next }}">

                <button type="submit" class="btn btn-login w-100">
                    Login
                </button>
            </form>

            <p class="text-center mt-4 mb-2">
                Don't have an account?
                <a href="{% url 'register' %}"
                   class="text-decoration-none fw-semibold">
                    Register
                </a>
            </p>

            <div class="text-center">
                <a href="{% url 'job_list' %}"
                   class="text-muted text-decoration-none small">
                    ← Back to Homepage
                </a>
            </div>

        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Job | JobFinder</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: white;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .navbar-brand {
            color: #2563eb;
            font-size: 26px;
            font-weight: 800;
        }

        .delete-card {
            border: none;
            border-radius: 20px;
            max-width: 550px;
            margin: auto;
        }

        .warning-icon {
            font-size: 65px;
        }

        .btn {
            border-radius: 10px;
            padding: 12px 25px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar py-3">
        <div class="container">
            <a href="{% url 'job_list' %}"
               class="navbar-brand text-decoration-none">
                💼 JobFinder
            </a>

            <a href="{% url 'my_jobs' %}"
               class="btn btn-outline-primary">
                ← My Jobs
            </a>
        </div>
    </nav>

    <!-- Delete Confirmation -->
    <main class="container py-5">

        <div class="card delete-card shadow-sm">

            <div class="card-body text-center p-5">

                <div class="warning-icon mb-3">⚠️</div>

                <h2 class="fw-bold text-danger mb-3">
                    Delete Job?
                </h2>

                <p class="text-muted">
                    Are you sure you want to delete this job?
                </p>

                <h5 class="fw-bold mb-3">
                    {{ job.title }}
                </h5>

                <p class="text-muted">
                    Company: {{ job.company }}
                </p>

                <div class="alert alert-warning">
                    This action cannot be undone.
                    Applications associated with this job
                    may also be deleted.
                </div>

                <!-- Delete Form -->
                <form method="POST">
                    {% csrf_token %}

                    <div class="d-flex justify-content-center gap-3">

                        <a href="{% url 'my_jobs' %}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                        <button type="submit"
                                class="btn btn-danger">
                            🗑️ Yes, Delete Job
                        </button>

                    </div>
                </form>

            </div>

        </div>

    </main>

</body>
</html>
